apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tic-tac-toe-ingress
spec:
  rules:
  - host: "samidhawani.in"
    http:
      paths:
      - pathType: Prefix
        path: "/app"
        backend:
          service:
            name: frontend-service
            port:
              number: 8081
  - host: "samidhawani.in"
    http:
      paths:
      - pathType: Prefix
        path: "/backend"
        backend:
          service:
            name: backend-service
            port:
              number: 5000
